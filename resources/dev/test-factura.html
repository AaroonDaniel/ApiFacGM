<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Probar API de Facturación</title>
<style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 320px; font-family: monospace; font-size: 13px; }
    button { padding: 10px 20px; font-size: 15px; cursor: pointer; margin-top: 10px; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .ok { border-left: 5px solid #2e7d32; }
    .fail { border-left: 5px solid #c62828; }
    h1 { font-size: 20px; }
</style>
</head>
<body>

<h1>Probar POST /api/facturas</h1>
<p>Edita el JSON si quieres y dale clic a "Enviar factura". Esto hace el POST real por ti (el navegador solo, visitando un link, nunca puede hacer POST).</p>

<label for="apikey"><strong>API key del sistema cliente</strong> (header Authorization: Bearer):</label><br>
<input type="text" id="apikey" style="width:100%; font-family: monospace; padding:6px; margin: 6px 0 16px;" placeholder="pega aquí tu API key">

<textarea id="json">{
  "emisor_nit": "3327479013",
  "referencia_externa": "orden_prueba_navegador",
  "metodo_pago": 1,
  "cliente": {
    "nombre_razon_social": "Cliente de Prueba",
    "tipo_documento": 1,
    "numero_documento": "999"
  },
  "detalle": [
    {
      "actividad_economica": "620000",
      "codigo_producto_sin": "83131",
      "codigo_producto": "P001",
      "descripcion": "Servicio de consultoria TI",
      "cantidad": 1,
      "unidad_medida": 57,
      "precio_unitario": 100.00
    }
  ]
}</textarea>

<br>
<button onclick="enviar()">Enviar factura</button>

<h2>Respuesta:</h2>
<pre id="resultado">(todavía no has enviado nada)</pre>

<script>
const apiKeyInput = document.getElementById('apikey');
apiKeyInput.value = localStorage.getItem('test_factura_apikey') || '';
apiKeyInput.addEventListener('input', () => {
    localStorage.setItem('test_factura_apikey', apiKeyInput.value);
});

async function enviar() {
    const resultado = document.getElementById('resultado');
    resultado.className = '';
    resultado.textContent = 'Enviando...';

    let body;
    try {
        body = JSON.parse(document.getElementById('json').value);
    } catch (e) {
        resultado.textContent = 'El JSON tiene un error de sintaxis: ' + e.message;
        resultado.className = 'fail';
        return;
    }

    try {
        const resp = await fetch('/api/facturas', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': 'Bearer ' + apiKeyInput.value.trim(),
            },
            body: JSON.stringify(body),
        });
        const data = await resp.json();
        resultado.textContent = 'HTTP ' + resp.status + '\n\n' + JSON.stringify(data, null, 2);
        resultado.className = resp.ok ? 'ok' : 'fail';
    } catch (e) {
        resultado.textContent = 'Error de red: ' + e.message;
        resultado.className = 'fail';
    }
}
</script>

</body>
</html>
